name: Deploy Databricks Bundle to PROD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: databricks-prod-deployment
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Deploy to PROD Databricks
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST_PROD }}
      DATABRICKS_AUTH_TYPE: azure-cli
      AZURE_CORE_OUTPUT: none

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verify Databricks authentication
        run: databricks current-user me

      - name: Validate Databricks bundle
        run: databricks bundle validate -t prod

      - name: Deploy bundle to PROD
        run: databricks bundle deploy -t prod
